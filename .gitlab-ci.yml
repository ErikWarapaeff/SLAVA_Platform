include:
  - component: $CI_SERVER_FQDN/engineering-team/engineering-standards/catalog-validation@0.2.2
  - component: $CI_SERVER_FQDN/engineering-team/engineering-standards/repository-audit@0.2.2
  - component: $CI_SERVER_FQDN/engineering-team/engineering-standards/python-quality@0.2.2
    inputs:
      image: python:3.12.8-slim-bookworm
      install-command: python -m pip install --no-cache-dir poetry==1.8.3 && poetry install --no-interaction --no-root
      lint-command: poetry run python -m compileall -q src tests
      test-command: PYTHONPATH=. poetry run pytest -q

stages:
  - validate
  - test
