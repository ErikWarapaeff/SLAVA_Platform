name: Research quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned tools and dependencies
        run: |
          python -m pip install --disable-pip-version-check 'git+https://gitlab.labaicii.tech/engineering-team/engineering-standards.git@0.2.2'
          python -m pip install --disable-pip-version-check poetry==1.8.3
          poetry install --no-interaction --no-root
      - name: Validate repository contract
        run: |
          validate-catalog catalog-info.yaml
          audit-repositories . --json-output /tmp/repository-audit.json --markdown-output /tmp/repository-audit.md
      - name: Run CPU-only checks
        run: |
          poetry run python -m compileall -q src tests
          poetry run pytest -q
